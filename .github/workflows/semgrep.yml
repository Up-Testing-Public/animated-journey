on:
  workflow_dispatch: {}
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, labeled]
  push:
    branches:
      - main
    paths:
      - .github/workflows/semgrep.yml
  schedule:
    - cron: '50 12 * * *'

name: Semgrep OSS Diff Scan

permissions:
  contents: read
  pull-requests: write

jobs:
  semgrep:
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'skip-semgrep') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install Semgrep OSS
        run: pip install semgrep

      - name: Fix Git and fetch base branch
        run: |
          git config --global --add safe.directory $GITHUB_WORKSPACE
          git fetch origin ${{ github.base_ref }}

      - name: Run Semgrep diff-only scan (gitleaks + secrets)
        run: |
          echo "🚀 Semgrep diff scan (p/gitleaks + p/secrets) against origin/${{ github.base_ref }}"
          semgrep scan \
            --config p/gitleaks \
            --config p/secrets \
            --baseline-commit origin/${{ github.base_ref }} \
            --error

      - name: Save JSON results
        run: |
          semgrep scan \
            --config p/gitleaks \
            --config p/secrets \
            --baseline-commit origin/${{ github.base_ref }} \
            --json > semgrep-results.json

      - name: Dump results to logs
        run: cat semgrep-results.json

  notify_slack:
    name: Notify Slack on blocked PR
    needs: semgrep
    # ensure this job runs even if semgrep fails, then filter on failure
    if: ${{ always() && needs.semgrep.result == 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - name: Send Slack alert
        run: |
          curl -X POST -H 'Content-type: application/json' \
            "${{ secrets.SLACK_WEBHOOK_URL }}" \
            --data @- <<'EOF'
          {
            "blocks": [
              {
                "type": "header",
                "text": {
                  "type": "plain_text",
                  "text": ":rotating_light: Semgrep Scan Blocked PR",
                  "emoji": true
                }
              },
              {
                "type": "section",
                "fields": [
                  {
                    "type": "mrkdwn",
                    "text": "*Repository:*\n${{ github.repository }}"
                  },
                  {
                    "type": "mrkdwn",
                    "text": "*PR:*\n<${{ github.event.pull_request.html_url }}|#${{ github.event.pull_request.number }}: ${{ github.event.pull_request.title }}>"
                  },
                  {
                    "type": "mrkdwn",
                    "text": "*Findings:*\n$(jq '.results|length' semgrep-results.json) total, $(jq '[.results[]|select(.extra.metadata.severity==\"ERROR\")]|length' semgrep-results.json) blocking"
                  }
                ]
              },
              {
                "type": "divider"
              },
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "*Example Failure:*\n• `$(jq -r '.results[0].check_id' semgrep-results.json)` — $(jq -r '.results[0].extra.message' semgrep-results.json | head -c 150)..."
                }
              },
              {
                "type": "actions",
                "elements": [
                  {
                    "type": "button",
                    "text": {
                      "type": "plain_text",
                      "text": "View Full Report"
                    },
                    "url": "${{ github.event.pull_request.html_url }}"
                  }
                ]
              }
            ]
          }
          EOF


  approve:
    name: Auto-approve if Semgrep passes
    needs: semgrep
    if: ${{ needs.semgrep.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Approve PR
        run: gh pr review --approve "${{ github.event.pull_request.html_url }}"
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_YOGENDRASRIVASTAVA }}
