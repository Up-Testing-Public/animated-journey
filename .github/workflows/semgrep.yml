on:
  workflow_dispatch: {}
  pull_request: {}
  push:
    branches:
      - main
    paths:
      - .github/workflows/semgrep.yml
  schedule:
    - cron: '50 12 * * *'  # daily scan

name: Semgrep

jobs:
  semgrep:
    name: semgrep/diff-scan
    runs-on: ubuntu-24.04
    container:
      image: returntocorp/semgrep
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}

      - run: |
          echo "🔍 Checking Git state"
          git branch -a
          git log --oneline | head -n 5
          echo "🔁 Diff against: origin/${{ github.base_ref }}"
          git fetch origin ${{ github.base_ref }}

      - run: |
          echo "🚀 Running Semgrep diff scan"
          semgrep --baseline-ref=origin/${{ github.base_ref }} --config auto

  approve:
    name: Approve PR if Semgrep passes
    runs-on: ubuntu-24.04
    needs: semgrep
    steps:
      - uses: actions/checkout@v3
      - name: Approve PR
        if: success()
        run: gh pr review --approve "${{ github.event.pull_request.html_url }}"
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_YOGENDRASRIVASTAVA }}
