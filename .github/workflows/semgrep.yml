on:
  workflow_dispatch: {}
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, labeled]
  push:
    branches:
      - main
    paths:
      - .github/workflows/semgrep.yml
  schedule:
    - cron: '50 12 * * *'

name: Semgrep OSS Diff Scan

permissions:
  contents: read
  pull-requests: write

jobs:
  semgrep:
    # if: ${{ !contains(github.event.pull_request.labels.*.name, 'skip-semgrep') }}
    # job always runs; false-positives are handled via private override
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 2

      - name: Cache pip dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-semgrep
          
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install Semgrep OSS
        run: pip install semgrep

      - name: Fix Git and fetch base branch
        run: |
          git config --global --add safe.directory $GITHUB_WORKSPACE
          git fetch origin ${{ github.base_ref }}

      - name: Run Semgrep diff-only scan (gitleaks + secrets)
        run: |
          echo "🚀 Semgrep diff scan (p/gitleaks + p/secrets) against origin/${{ github.base_ref }}"
          semgrep scan \
            --config p/gitleaks \
            --config p/secrets \
            --baseline-commit origin/${{ github.base_ref }} \
            --error

      - name: Save JSON results
        run: |
          semgrep scan \
            --config p/gitleaks \
            --config p/secrets \
            --baseline-commit origin/${{ github.base_ref }} \
            --json > semgrep-results.json

      - name: Dump results to logs
        run: cat semgrep-results.json
        
  notify_slack:
    name: Notify Slack on blocked PR
    needs: semgrep
    if: ${{ always() && needs.semgrep.result == 'failure' && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest

    steps:
      # ── expose the secret so the next step can use it ──
      - name: Export Slack webhook (no-op)
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: echo "webhook ready"

      - name: Send Slack alert
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          PR_NUMBER=${{ github.event.pull_request.number }}
          PR_URL=${{ github.event.pull_request.html_url }}
          REPO=${{ github.repository }}
          ACTOR=${{ github.actor }}                               # who triggered the run

          # Link to the manual Skip-Semgrep workflow
          RUN_LINK="https://github.com/${REPO}/actions/workflows/skip_semgrep.yml"

          curl -X POST -H 'Content-type: application/json' \
               --data @- "$SLACK_WEBHOOK_URL" <<EOF
          {
            "text": ":rotating_light: *Semgrep blocked* <${PR_URL}|PR #${PR_NUMBER}> in *${REPO}*.\nIf this is a false positive, click <${RUN_LINK}|Run Skip-Semgrep> and enter:\n• PR #: *${PR_NUMBER}*\n• Actor: *${ACTOR}*"
          }
          EOF

  approve:
    name: Auto-approve if Semgrep passes
    needs: semgrep
    if: ${{ needs.semgrep.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Approve PR
        run: gh pr review --approve "${{ github.event.pull_request.html_url }}"
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_YOGENDRASRIVASTAVA }}
