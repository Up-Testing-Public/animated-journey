on:
  workflow_dispatch: {}
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    paths:
      - .github/workflows/semgrep.yml
  schedule:
    - cron: '50 12 * * *'

name: Semgrep OSS Diff Scan

jobs:
  semgrep:
    name: semgrep/oss-diff
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install Semgrep OSS
        run: pip install semgrep

      - name: Fix Git safe directory & fetch base
        run: |
          git config --global --add safe.directory $GITHUB_WORKSPACE
          git fetch origin ${{ github.base_ref }}

      - name: Run Semgrep on PR diff
        run: |
          echo "🚀 Running Semgrep OSS Diff Scan"
          semgrep --baseline-ref=origin/${{ github.base_ref }} --config auto

  approve:
    name: Approve PR if Semgrep passes
    runs-on: ubuntu-latest
    needs: semgrep
    steps:
      - uses: actions/checkout@v3
      - name: Auto-approve PR
        if: success()
        run: gh pr review --approve "${{ github.event.pull_request.html_url }}"
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_YOGENDRASRIVASTAVA }}
