on:
  workflow_dispatch: {}
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    paths:
      - .github/workflows/semgrep.yml
  schedule:
    - cron: '50 12 * * *'

name: Semgrep OSS Diff Scan

jobs:
  semgrep:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install Semgrep OSS
        run: pip install semgrep

      - name: Fix Git and fetch base branch
        run: |
          git config --global --add safe.directory $GITHUB_WORKSPACE
          git fetch origin ${{ github.base_ref }}

      - name: Run Semgrep diff-only scan (CI + credentials)
        run: |
          echo "🚀 Semgrep diff scan (CI + credentials) against origin/${{ github.base_ref }}"
          semgrep scan \
            --config p/ci \
            --config p/credentials \
            --baseline-commit origin/${{ github.base_ref }} \
            --error

      - name: Save Semgrep JSON results
        run: |
          semgrep scan \
            --config p/ci \
            --config p/credentials \
            --baseline-commit origin/${{ github.base_ref }} \
            --json > semgrep-results.json

      - name: Dump Semgrep results to logs
        run: cat semgrep-results.json

  approve:
    name: Auto-approve if Semgrep passes
    runs-on: ubuntu-latest
    needs: semgrep
    steps:
      - uses: actions/checkout@v3
      - name: Approve PR
        if: success()
        run: gh pr review --approve "${{ github.event.pull_request.html_url }}"
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_YOGENDRASRIVASTAVA }}
