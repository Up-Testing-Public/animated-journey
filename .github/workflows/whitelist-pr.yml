name: "Whitelist PR via Comment"

on:
  issue_comment:
    types: [created]

permissions:
  issues: write

jobs:
  whitelist-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Whitelist PR if `/skip-semgrep` by allowed user
        uses: actions/github-script@v6
        env:
          ALLOWED_USERS: |
            Indrajith-S
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const comment = context.payload.comment.body.trim();
            console.log("DEBUG: comment body =", comment);
            const commenter = context.payload.comment.user.login;
            console.log("DEBUG: commenter login =", commenter);
            const allowed = process.env.ALLOWED_USERS
              .split('\n')
              .map(u => u.trim().toLowerCase());
            console.log("DEBUG: allowed list =", allowed);
            if (comment !== '/skip-semgrep') {
              console.log('No whitelist command; exiting.');
              return;
            }
            if (!allowed.includes(commenter.toLowerCase())) {
              console.log(`User ${commenter} not in allowed list; exiting.`);
              return;
            }
            const issue = context.payload.issue;
            if (!issue.pull_request) {
              console.log('Not a PR comment; exiting.');
              return;
            }
            await github.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              labels: ['skip-semgrep'],
            });
            console.log(`✅ PR #${issue.number} whitelisted by ${commenter}.`);
